<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>TFT攻略網站</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      margin: 0;
    }

    .board {
      width: 70%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      padding: 20px;
      background: #222;
    }

    .cell {
      width: 100%;
      padding-top: 100%;
      background: #444;
      position: relative;
    }

    .unit-list {
      width: 30%;
      padding: 20px;
      background: #f5f5f5;
    }

    .unit {
      padding: 10px;
      margin: 5px 0;
      background: #ddd;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- 棋盤 -->
  <div class="board" id="board"></div>

  <!-- 右邊棋子 -->
  <div class="unit-list">
    <h3>棋子</h3>
    <div class="unit" onclick="addUnit('亞索')">亞索</div>
    <div class="unit" onclick="addUnit('劫')">劫</div>
  </div>

  <script>
    const board = document.getElementById("board");

    // 建立棋盤 8x4
    for (let i = 0; i < 32; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      board.appendChild(cell);
    }

    // 點擊加入棋子（先簡單版本）
    function addUnit(name) {
      const cells = document.querySelectorAll(".cell");
      for (let cell of cells) {
        if (!cell.innerText) {
          cell.innerText = name;
          break;
        }
      }
    }
  </script>

</body>
</html>
