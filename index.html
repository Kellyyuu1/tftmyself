<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自訂戰棋攻略網站</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: #fff;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid #232a33;
      background: #090d12;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #ffc928;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      padding: 20px;
    }

    .traits-panel,
    .board-panel,
    .units-panel {
      background: #0d1118;
      border: 1px solid #303843;
      border-radius: 22px;
    }

    .traits-panel {
      padding: 20px;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .trait-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 12px;
      background: #151b24;
      border: 1px solid #2f3845;
      border-radius: 14px;
    }

    .trait-name {
      font-weight: 800;
      font-size: 16px;
    }

    .trait-detail {
      font-size: 12px;
      color: #9da8b5;
      margin-top: 4px;
    }

    .trait-count {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #ffc928;
      color: #101010;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .board-panel {
      padding: 22px;
      overflow-x: auto;
    }

    .board {
      min-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      padding-top: 20px;
    }

    .board-row {
      display: flex;
      gap: 10px;
    }

    .board-row.offset {
      margin-left: 58px;
    }

    .hex {
      width: 105px;
      height: 118px;
      background: #0a0f15;
      clip-path: polygon(
        25% 5%,
        75% 5%,
        100% 50%,
        75% 95%,
        25% 95%,
        0% 50%
      );
      border: 4px solid #222831;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-weight: 900;
      font-size: 15px;
      color: #fff;
      transition: 0.15s;
    }

    .hex:hover {
      transform: translateY(-3px);
      border-color: #ffc928;
    }

    .hex.filled {
      background: #182334;
    }

    .units-panel {
      margin: 0 20px 20px;
      padding: 18px;
    }

    .units-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .selected-text {
      color: #ffc928;
      font-weight: 800;
    }

    .units-list {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .unit-card {
      width: 170px;
      min-height: 110px;
      background: #141b25;
      border: 3px solid #444;
      border-radius: 18px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .unit-card:hover {
      transform: translateY(-3px);
      background: #1a2330;
    }

    .unit-card.selected {
      box-shadow: 0 0 0 3px #ffc928;
    }

    .unit-name {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .unit-cost {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      background: #ffc928;
      color: #111;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .unit-traits {
      color: #c4ccd6;
      font-size: 14px;
      line-height: 1.5;
    }

    .cost-1 {
      border-color: #9ca3af;
    }

    .cost-2 {
      border-color: #22c55e;
    }

    .cost-3 {
      border-color: #3b82f6;
    }

    .cost-4 {
      border-color: #a855f7;
    }

    .cost-5 {
      border-color: #facc15;
    }

    .empty-text {
      color: #9da8b5;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="logo">自訂戰棋攻略</div>
    </header>

    <main class="main">
      <section class="traits-panel">
        <div class="panel-title">特性</div>
        <div id="traitsList"></div>
      </section>

      <section class="board-panel">
        <div class="panel-title">棋盤</div>
        <div class="board" id="board"></div>
      </section>
    </main>

    <section class="units-panel">
      <div class="units-header">
        <div class="panel-title">棋子</div>
        <div class="selected-text" id="selectedUnitText">目前未選擇棋子</div>
      </div>

      <div class="units-list" id="unitsList"></div>
    </section>
  </div>

  <script>
    const units = [
      { name: "陳沅寬", cost: 5, traits: ["秀明路", "缺愛", "資科系"] },
      { name: "余名卉", cost: 5, traits: ["秀明路", "王"] },
      { name: "熊冠婷", cost: 3, traits: ["叛徒", "秀明路"] },
      { name: "高育文", cost: 2, traits: ["秀明路", "資科系"] },
      { name: "顏君穎", cost: 3, traits: ["秀明路", "資科系", "綠帽"] }
    ];

    const traitDescriptions = {
      "秀明路": "秀明路羈絆啟動。",
      "缺愛": "需要更多關注。",
      "資科系": "科技與邏輯能力提升。",
      "王": "全場核心角色。",
      "叛徒": "陣容不穩定因素。",
      "綠帽": "特殊狀態羈絆。"
    };

    let selectedUnit = null;
    let boardState = [];

    const unitsList = document.getElementById("unitsList");
    const board = document.getElementById("board");
    const traitsList = document.getElementById("traitsList");
    const selectedUnitText = document.getElementById("selectedUnitText");

    function renderUnits() {
      unitsList.innerHTML = "";

      units.forEach(unit => {
        const card = document.createElement("div");
        card.className = `unit-card cost-${unit.cost}`;

        card.innerHTML = `
          <div class="unit-name">${unit.name}</div>
          <div class="unit-cost">${unit.cost} 費</div>
          <div class="unit-traits">${unit.traits.join(" / ")}</div>
        `;

        card.addEventListener("click", () => {
          selectedUnit = unit;
          selectedUnitText.textContent = `目前選擇棋子：${unit.name}`;

          document.querySelectorAll(".unit-card").forEach(c => {
            c.classList.remove("selected");
          });

          card.classList.add("selected");
        });

        unitsList.appendChild(card);
      });
    }

    function renderBoard() {
      board.innerHTML = "";
      boardState = [];

      const layout = [7, 7, 7, 7];

      layout.forEach((count, rowIndex) => {
        const row = document.createElement("div");
        row.className = "board-row";

        if (rowIndex % 2 === 1) {
          row.classList.add("offset");
        }

        for (let i = 0; i < count; i++) {
          const cell = document.createElement("div");
          cell.className = "hex";
          cell.dataset.index = boardState.length;

          boardState.push(null);

          cell.addEventListener("click", () => {
            const index = Number(cell.dataset.index);

            if (selectedUnit) {
              boardState[index] = selectedUnit;
            } else if (boardState[index]) {
              boardState[index] = null;
            }

            updateBoard();
            updateTraits();
          });

          row.appendChild(cell);
        }

        board.appendChild(row);
      });

      updateBoard();
    }

    function updateBoard() {
      const cells = document.querySelectorAll(".hex");

      cells.forEach((cell, index) => {
        const unit = boardState[index];

        cell.className = "hex";

        if (unit) {
          cell.textContent = unit.name;
          cell.classList.add("filled", `cost-${unit.cost}`);
        } else {
          cell.textContent = "";
        }
      });
    }

    function updateTraits() {
      const traitCount = {};
      const countedUnits = new Set();

      boardState.forEach(unit => {
        if (unit && !countedUnits.has(unit.name)) {
          countedUnits.add(unit.name);

          unit.traits.forEach(trait => {
            traitCount[trait] = (traitCount[trait] || 0) + 1;
          });
        }
      });

      traitsList.innerHTML = "";

      const traitNames = Object.keys(traitCount);

      if (traitNames.length === 0) {
        traitsList.innerHTML = `<div class="empty-text">目前沒有已上場棋子</div>`;
        return;
      }

      traitNames.forEach(trait => {
        const item = document.createElement("div");
        item.className = "trait-item";

        item.innerHTML = `
          <div>
            <div class="trait-name">${trait}</div>
            <div class="trait-detail">${traitDescriptions[trait] || "尚未設定說明。"}</div>
          </div>
          <div class="trait-count">${traitCount[trait]}</div>
        `;

        traitsList.appendChild(item);
      });
    }

    renderUnits();
    renderBoard();
    updateTraits();
  </script>
</body>
</html>
