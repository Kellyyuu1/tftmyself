<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFT 自訂攻略網站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-area {
      display: flex;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    /* 左側特性欄 */
    .traits-panel {
      width: 280px;
      background: #111823;
      border: 1px solid #2a3442;
      border-radius: 20px;
      padding: 20px;
    }

    .traits-panel h2 {
      margin-top: 0;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .trait-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a2330;
      border: 1px solid #2d3a4b;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .trait-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trait-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #2c3747;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .trait-name {
      font-size: 16px;
      font-weight: bold;
    }

    .trait-count {
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f2c94c;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* 右側棋盤區 */
    .board-panel {
      flex: 1;
      background: #0d131c;
      border: 1px solid #2a3442;
      border-radius: 24px;
      padding: 24px;
      overflow: auto;
    }

    .board-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 850px;
    }

    .board-row {
      display: flex;
      gap: 8px;
    }

    .board-row.offset {
      margin-left: 52px;
    }

    /* 六角格 */
    .hex {
      width: 96px;
      height: 110px;
      background: #131b26;
      position: relative;
      clip-path: polygon(
        25% 6%,
        75% 6%,
        100% 50%,
        75% 94%,
        25% 94%,
        0% 50%
      );
      border: 2px solid #2d3746;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      transition: 0.2s;
    }

    .hex:hover {
      border-color: #f2c94c;
      transform: translateY(-2px);
    }

    .hex.filled {
      background: #1e2f45;
      border-color: #4da3ff;
    }

    /* 下方棋子區 */
    .units-panel {
      padding: 20px;
      border-top: 1px solid #222c38;
      background: #0f151e;
    }

    .units-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .units-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .unit-card {
      width: 140px;
      background: #17202b;
      border: 1px solid #2e3948;
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .unit-card:hover {
      transform: translateY(-3px);
      border-color: #f2c94c;
    }

    .unit-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .unit-traits {
      font-size: 14px;
      color: #c8d2dc;
      line-height: 1.5;
    }

    .selected-unit {
      margin-top: 12px;
      color: #f2c94c;
      font-size: 16px;
      font-weight: bold;
    }

    @media (max-width: 1100px) {
      .top-area {
        flex-direction: column;
      }

      .traits-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-area">
      <!-- 左邊特性 -->
      <div class="traits-panel">
        <h2>特性</h2>
        <div id="traitsList"></div>
      </div>

      <!-- 右邊棋盤 -->
      <div class="board-panel">
        <div class="board-title">棋盤</div>
        <div class="board" id="board"></div>
      </div>
    </div>

    <!-- 下方棋子 -->
    <div class="units-panel">
      <div class="units-title">棋子</div>
      <div class="units-list" id="unitsList"></div>
      <div class="selected-unit" id="selectedUnitText">目前未選擇棋子</div>
    </div>
  </div>

  <script>
    const units = [
      { name: "亞索", traits: ["浪人", "決鬥者"] },
      { name: "劫", traits: ["忍者", "刺客"] },
      { name: "凱莎", traits: ["暗星", "遊俠"] },
      { name: "蓋倫", traits: ["聖盾", "戰士"] },
      { name: "阿璃", traits: ["魔女", "法師"] }
    ];

    let selectedUnit = null;
    let boardState = [];

    const unitsList = document.getElementById("unitsList");
    const board = document.getElementById("board");
    const traitsList = document.getElementById("traitsList");
    const selectedUnitText = document.getElementById("selectedUnitText");

    // 建立下方棋子卡
    function renderUnits() {
      unitsList.innerHTML = "";

      units.forEach(unit => {
        const card = document.createElement("div");
        card.className = "unit-card";
        card.innerHTML = `
          <div class="unit-name">${unit.name}</div>
          <div class="unit-traits">${unit.traits.join(" / ")}</div>
        `;

        card.addEventListener("click", () => {
          selectedUnit = unit;
          selectedUnitText.textContent = `目前選擇棋子：${unit.name}`;
        });

        unitsList.appendChild(card);
      });
    }

    // 建立六角棋盤
    function renderBoard() {
      board.innerHTML = "";
      boardState = [];

      const layout = [7, 7, 7, 7];

      layout.forEach((count, rowIndex) => {
        const row = document.createElement("div");
        row.className = "board-row";

        if (rowIndex % 2 === 1) {
          row.classList.add("offset");
        }

        for (let i = 0; i < count; i++) {
          const cell = document.createElement("div");
          cell.className = "hex";
          cell.dataset.index = boardState.length;

          boardState.push(null);

          cell.addEventListener("click", () => {
            const index = Number(cell.dataset.index);

            if (selectedUnit) {
              boardState[index] = selectedUnit;
              updateBoard();
              updateTraits();
            } else if (boardState[index]) {
              boardState[index] = null;
              updateBoard();
              updateTraits();
            }
          });

          row.appendChild(cell);
        }

        board.appendChild(row);
      });

      updateBoard();
    }

    // 更新棋盤畫面
    function updateBoard() {
      const cells = document.querySelectorAll(".hex");

      cells.forEach((cell, index) => {
        const unit = boardState[index];

        if (unit) {
          cell.textContent = unit.name;
          cell.classList.add("filled");
        } else {
          cell.textContent = "";
          cell.classList.remove("filled");
        }
      });
    }

    // 計算特性
    function updateTraits() {
      const traitCount = {};

      boardState.forEach(unit => {
        if (unit) {
          unit.traits.forEach(trait => {
            traitCount[trait] = (traitCount[trait] || 0) + 1;
          });
        }
      });

      traitsList.innerHTML = "";

      const traitNames = Object.keys(traitCount);

      if (traitNames.length === 0) {
        traitsList.innerHTML = "<div style='color:#aaa;'>目前沒有已上場棋子</div>";
        return;
      }

      traitNames.forEach(trait => {
        const item = document.createElement("div");
        item.className = "trait-item";
        item.innerHTML = `
          <div class="trait-left">
            <div class="trait-icon">特</div>
            <div class="trait-name">${trait}</div>
          </div>
          <div class="trait-count">${traitCount[trait]}</div>
        `;
        traitsList.appendChild(item);
      });
    }

    renderUnits();
    renderBoard();
    updateTraits();
  </script>
</body>
</html>
